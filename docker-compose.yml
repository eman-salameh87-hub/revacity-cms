services:
  db:
    image: postgres:15-alpine
    container_name: revacity-cms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revacity_cms
    ports:
      # 5432 is a native PostgreSQL service on this machine, 5433/5435 are
      # taken by other projects' containers, so this one (revacity-cms's own
      # database) is published on 5436. DATABASE_URL in .env must match.
      - "5436:5432"
    volumes:
      - revacity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revacity_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: revacity-cms-redis
    ports:
      # 6379 is used by other projects' containers on this machine.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  revacity_postgres_data:
